name: Release

# Every Mac, one download: pushing a version tag builds orbit for Apple silicon
# and Intel, checks the bundle and the disk image, and publishes them.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The tag is the source of truth for the version. It is written into mygo.json
# before the build, so Info.plist, the .dmg name, the in-app build stamp and the
# release page carry the same number. Only macOS is built here; the app is a
# macOS-only MyGo/WKWebView bundle.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (default: mygo.json)"
        required: false
        type: string
      publish:
        description: Create or update the GitHub release
        type: boolean
        default: true
      draft:
        description: Leave the release as a draft
        type: boolean
        default: false

# A release is not worth racing: never cancel one half-way through, and never
# run two for the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  MYGO_VERSION: v0.6.4
  BUNDLE: MoleStudio.app
  PLATFORM_DIR: build/darwin-universal

jobs:
  release:
    name: Build & release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # MyGo is not vendored; install the version the build uses, as CI does.
      - name: Install the MyGo CLI
        run: |
          go install "github.com/egoist/mygo/cmd/mygo@${MYGO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/mygo" version

      - name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
            [[ -n "$version" ]] || version="$(jq -r .version mygo.json)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is not a MAJOR.MINOR.PATCH version (CFBundleShortVersionString holds three numbers)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Releasing orbit $version from $GITHUB_REF"

      - name: Stamp the version into mygo.json
        run: scripts/set-version.sh "$VERSION"

      - name: Vet and test
        run: make check

      # The 体检 panel shows the commit, so a bug report names the code.
      - name: Stamp the commit into the build
        run: |
          echo "MYGO_LDFLAGS=-X github.com/mymoles/mole-studio/internal/scanner.BuildCommit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # The bundle is ad-hoc signed (macos.signingIdentity "-" in mygo.json) and
      # not notarized, so Gatekeeper asks once before the first launch. To ship
      # notarized builds, put a Developer ID and macos.notarize.keychainProfile
      # in mygo.json and import the certificate into the runner's keychain
      # before this step.
      - name: Build the app and the disk image
        run: mygo build --platform darwin/universal

      - name: Verify the artifacts
        run: |
          set -euo pipefail
          app="$PLATFORM_DIR/$BUNDLE"
          binary="$app/Contents/MacOS/MoleStudio"
          plist="$app/Contents/Info.plist"

          test -d "$app"
          test -x "$binary"
          plutil -lint "$plist" > /dev/null

          # Apple silicon and Intel in one bundle: lipo is the only honest check.
          archs="$(lipo -archs "$binary")"
          echo "architectures: $archs"
          for arch in arm64 x86_64; do
            [[ " $archs " == *" $arch "* ]] || { echo "::error::$binary has no $arch slice"; exit 1; }
          done

          # The tag is the version the bundle and the app report.
          for key in CFBundleShortVersionString CFBundleVersion; do
            got="$(plutil -extract "$key" raw "$plist")"
            [[ "$got" == "$VERSION" ]] || { echo "::error::$key is '$got', want '$VERSION'"; exit 1; }
          done
          [[ "$(plutil -extract CFBundleIdentifier raw "$plist")" == "com.mymoles.mole-studio" ]]
          test -f "$app/Contents/Resources/AppIcon.icns"
          case "$(plutil -extract CFBundleIconFile raw "$plist")" in
            AppIcon|AppIcon.icns) ;;
            *) echo "::error::CFBundleIconFile does not point at AppIcon"; exit 1 ;;
          esac

          # The page is embedded in the binary, not copied next to it.
          grep -aq "MOLE_STUDIO_STATE_V8" "$binary"

          # Ad-hoc signature: prove it is intact. spctl would reject it without
          # a Developer ID, which is not what is being tested here.
          codesign --verify --deep --strict "$app"

          dmg=("$PLATFORM_DIR"/*.dmg)
          [[ ${#dmg[@]} -eq 1 ]] || { echo "::error::expected one .dmg, found ${#dmg[@]}"; exit 1; }

          # The disk image is the download: mount it, look at what users get,
          # and detach it again even when a check fails.
          mount="$RUNNER_TEMP/dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "${dmg[0]}" > /dev/null
          trap 'hdiutil detach "$mount" > /dev/null 2>&1 || true' EXIT
          test -d "$mount/$BUNDLE"
          test -L "$mount/Applications"
          # The copy inside the download is the one users get: check it too.
          [[ "$(plutil -extract CFBundleShortVersionString raw "$mount/$BUNDLE/Contents/Info.plist")" == "$VERSION" ]]
          codesign --verify --deep --strict "$mount/$BUNDLE"
          hdiutil detach "$mount" > /dev/null
          trap - EXIT

      - name: Collect the release assets
        run: |
          set -euo pipefail
          dmg=("$PLATFORM_DIR"/*.dmg)
          asset="MoleStudio-${VERSION}-universal.dmg"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${dmg[0]}" "$RUNNER_TEMP/release/$asset"
          ( cd "$RUNNER_TEMP/release" && shasum -a 256 "$asset" > "$asset.sha256" )

      - name: Write the run summary
        run: |
          set -euo pipefail
          {
            echo "## orbit $TAG"
            echo
            echo "| Asset | SHA-256 |"
            echo "| --- | --- |"
            for file in "$RUNNER_TEMP/release"/*.dmg; do
              # shellcheck disable=SC2016 # markdown backticks, not a command
              printf '| %s | `%s` |\n' "$(basename "$file")" "$(shasum -a 256 "$file" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the artifacts on the run
        uses: actions/upload-artifact@v7
        with:
          name: MoleStudio-${{ env.VERSION }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
          # Re-running the job for the same tag replaces the previous upload
          # instead of failing because the artifact name is taken.
          overwrite: true

      # gh is on every runner and authenticates with GITHUB_TOKEN, so no
      # third-party action gets to see the token.
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$RUNNER_TEMP/release"/*)
          (( ${#assets[@]} )) || { echo "::error::no assets to publish"; exit 1; }

          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of the tag, or a hand-started release that already
            # exists: replace the assets instead of failing.
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [[ "$DRAFT" != "true" ]]; then
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            args=(--title "orbit $TAG" --generate-notes)
            if [[ "$DRAFT" == "true" ]]; then
              args+=(--draft)
            fi
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              # A hand-started run has no tag yet: release the commit it built.
              args+=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${assets[@]}" "${args[@]}"
          fi
