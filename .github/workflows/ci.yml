name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package .app bundle
        run: make app

      - name: Verify bundle layout
        run: |
          set -euo pipefail
          test -x dist/MoleStudio.app/Contents/MacOS/MoleStudio
          test -f dist/MoleStudio.app/Contents/Resources/src-ui/index.html
          test -f dist/MoleStudio.app/Contents/Info.plist
          plutil -lint dist/MoleStudio.app/Contents/Info.plist

          # The icon must ship inside the bundle and be wired up via CFBundleIconFile.
          test -f dist/MoleStudio.app/Contents/Resources/AppIcon.icns
          test "$(plutil -extract CFBundleIconFile raw dist/MoleStudio.app/Contents/Info.plist)" = "AppIcon"

          # An .icns is a container: confirm all ten expected representations survived.
          iconutil -c iconset dist/MoleStudio.app/Contents/Resources/AppIcon.icns -o /tmp/verify.iconset
          test "$(ls /tmp/verify.iconset | wc -l | tr -d ' ')" = "10"

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
