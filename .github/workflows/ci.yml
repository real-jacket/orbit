name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The MyGo CLI is not vendored; every job installs the version the build uses.
  MYGO_VERSION: v0.6.4

jobs:
  build:
    name: Build & package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          go version
          sw_vers

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Frontend regression checks
        run: node scripts/test-ui.cjs

      - name: WebKit layout and interaction checks
        run: make test-ui-webkit

      - name: Build
        run: go build -v ./...

      - name: Install the MyGo CLI
        run: |
          go install "github.com/egoist/mygo/cmd/mygo@${MYGO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package the .app bundle
        run: mygo build --skip-dmg

      # MyGo writes into a per-platform subdirectory: build/<goos>-<goarch>/.
      - name: Verify bundle layout
        run: |
          set -euo pipefail
          bundle="build/$(go env GOOS)-$(go env GOARCH)/MoleStudio.app"
          test -d "$bundle"
          test -x "$bundle/Contents/MacOS/MoleStudio"
          test -f "$bundle/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Info.plist"

          # The page is embedded in the binary rather than copied next to it,
          # so look for a marker only the frontend contains.
          grep -aq "MOLE_STUDIO_STATE_V8" "$bundle/Contents/MacOS/MoleStudio"

          # The icon must ship and be wired up via CFBundleIconFile. MyGo writes
          # the key as "AppIcon.icns"; the extension is optional to Launch
          # Services, so accept either spelling rather than pin MyGo's.
          test -f "$bundle/Contents/Resources/AppIcon.icns"
          case "$(plutil -extract CFBundleIconFile raw "$bundle/Contents/Info.plist")" in
            AppIcon|AppIcon.icns) ;;
            *) echo "CFBundleIconFile does not point at AppIcon" >&2; exit 1 ;;
          esac

          # An .icns is a container. MyGo renders it from assets/icon.png and
          # deliberately emits eight representations — it skips the 16 and
          # 32 pixel entries because IconServices reads their payloads as the
          # old ARGB format. Check the sizes that must be there instead of a
          # count, so adding a representation later does not break CI.
          iconutil -c iconset "$bundle/Contents/Resources/AppIcon.icns" -o /tmp/verify.iconset
          for rep in icon_16x16@2x.png icon_128x128.png icon_256x256.png \
                     icon_256x256@2x.png icon_512x512.png icon_512x512@2x.png; do
            test -f "/tmp/verify.iconset/$rep"
          done

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: The generated TypeScript client is current
        run: |
          go install "github.com/egoist/mygo/cmd/mygo@${MYGO_VERSION}"
          "$(go env GOPATH)/bin/mygo" generate
          git diff --exit-code -- mygo.ts
