name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether upstream `mo` already covers this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Deep Clean
        - AI Care
        - Uninstaller
        - Optimize
        - Disk Analyzer
        - Live Status
        - Purge
        - History & Whitelist
        - Build / packaging / CI
        - Other
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request involves deleting files or changing the whitelist
          required: false
