# SwiftLint configuration for orbit.
# Run locally with: make lint

included:
  - Sources
  - Tests

excluded:
  - .build
  - dist

disabled_rules:
  - todo
  - trailing_comma
  # Upstream `mo` names its protection file `~/.config/mole/whitelist` and its flag `--whitelist`.
  # That is the domain vocabulary this client has to interoperate with.
  - inclusive_language
  # The status popover lays out (title, action, y) triples; a struct would be pure noise.
  - large_tuple
  - implicit_optional_initialization

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 200
  error: 280
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 700
  error: 1200

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 90
  error: 160

cyclomatic_complexity:
  warning: 25
  error: 40

identifier_name:
  # Single letters are used for tight Canvas and loop locals.
  min_length: 1
  excluded:
    - id
    - mo
    - vm
    # These mirror the `mo --json` payload schema verbatim.
    - is_dir
    - scan_status
    - memory_mb
